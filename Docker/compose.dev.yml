name: databus-dev
services:
  web:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - ../.env
      - ../.env.dev
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      target: dev
    entrypoint: ["/app/Docker/docker-entrypoint.sh"]
    command: ["uv", "run", "celery", "-A", "realtime", "worker", "-l", "info"]
    env_file:
      - ../.env
      - ../.env.dev
    environment:
      # DEBUG comes from .env.dev
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DB_NAME=${DB_NAME:-databus}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MIGRATE_ON_CELERY=0
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      target: dev
    entrypoint: ["/app/Docker/docker-entrypoint.sh"]
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "realtime",
        "beat",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler",
        "--loglevel=info",
      ]
    env_file:
      - ../.env
      - ../.env.dev
    environment:
      # DEBUG comes from .env.dev
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DB_NAME=${DB_NAME:-databus}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MIGRATE_ON_CELERY=0
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=${DB_NAME:-databus}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-databus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
