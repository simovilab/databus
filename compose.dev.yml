name: databus-dev
services:
  backend:
    build:
      context: ./processing
      target: dev
    env_file:
      - .env
      - .env.dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./processing:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy

  realtime-engine:
    build:
      context: ./processing
      target: realtime-engine
    environment:
      - RUN_MIGRATIONS=False
      - CREATE_SUPERUSER=False
      - LOAD_FIXTURES=False
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./processing:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  tasks:
    build:
      context: ./processing
      target: tasks
    environment:
      - RUN_MIGRATIONS=False
      - CREATE_SUPERUSER=False
      - LOAD_FIXTURES=False
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./processing:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  scheduler:
    build:
      context: ./processing
      target: scheduler
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./processing:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  store:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=${DB_NAME:-databus}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "${STORE_PORT:-5432}:5432"
    volumes:
      - store_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-databus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  state:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${STATE_PORT:-6379}:6379"
    volumes:
      - state_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  telemetry-broker: 
    image: emqx/nanomq:0.24.9-full
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"

  message-broker:
    image: rabbitmq:4-management
    ports:
      - "${MESSAGE_BROKER_AMQP_PORT:-5672}:5672"          # AMQP
      - "${MESSAGE_BROKER_MANAGEMENT_PORT:-15672}:15672"  # Management UI
      - "${MESSAGE_BROKER_PROMETHEUS_PORT:-15692}:15692"  # Prometheus
    volumes:
      - message_broker_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-engine:
    image: prefecthq/prefect:3-latest
    ports:
      - "${ANALYTICS_PORT:-4200}:4200"
    environment:
      - PREFECT_SERVER_API_HOST=${PREFECT_SERVER_API_HOST:-0.0.0.0}
      - PREFECT_API_URL=${PREFECT_API_URL:-http://localhost:4200/api}
    volumes:
      - ./analytics-engine:/prefect
    working_dir: /prefect
    command: prefect server start

volumes:
  store_data:
  state_data:
  lake_data:
  message_broker_data:
