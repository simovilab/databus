name: databus-dev
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy

  store:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=${DB_NAME:-databus}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-databus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  state:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  realtime-engine:
    build:
      context: ./realtime-engine
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./realtime-engine:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy

  mqtt-broker: 
    image: hivemq/hivemq-ce
    ports:
      - "1883:1883"
    volumes:
      - hivemq_data:/opt/hivemq/data
      - ./mqtt-broker/hivemq-config.xml:/opt/hivemq/conf/config.xml
    environment:
      - HIVEMQ_LOG_LEVEL=${HIVEMQ_LOG_LEVEL:-INFO}

  message-broker:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"   # AMQP 0-9-1 and AMQP 1.0
      - "15672:15672" # HTTP API
      - "15692:15692" # Prometheus exporter API over HTTP
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  publisher:
    build:
      context: ./publisher
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.dev
    command: 
      [
        "uv", 
        "run", 
        "celery", 
        "-A", 
        "publisher", 
        "worker", 
        "--loglevel=info"
      ]
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-message-broker}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - DB_NAME=${DB_NAME:-databus}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=store
      - DB_PORT=5432
      - REDIS_HOST=state
      - REDIS_PORT=6379
    volumes:
      - ./publisher:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.dev
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "scheduler",
        "beat",
        "--loglevel=info",
      ]
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-message-broker}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
    volumes:
      - ./scheduler:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  analytics:
    image: prefecthq/prefect:3-latest
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=${PREFECT_SERVER_API_HOST:-0.0.0.0}
      - PREFECT_API_URL=${PREFECT_API_URL:-http://localhost:4200/api}
    volumes:
      - ./analytics:/prefect
    working_dir: /prefect
    command: prefect server start

volumes:
  postgres_data:
  redis_data:
  hivemq_data:
  rabbitmq_data:
