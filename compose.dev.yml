name: databus-dev
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
      - .env.dev
    environment:
      - DB_NAME=${DB_NAME:-databus}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=store
      - DB_PORT=5432
    volumes:
      - ./backend:/app
      - /app/.venv          # anonymous volume — prevents macOS host venv from leaking in
      - gtfs_rt_feeds:/app/feed/files
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy

  store:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=${DB_NAME:-databus}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "${STORE_PORT:-5432}:5432"
    volumes:
      - store_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-databus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  state:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${STATE_PORT:-6379}:6379"
    volumes:
      - state_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  realtime-engine:
    build:
      context: ./realtime-engine
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
      - .env.dev
    environment:
      - REDIS_HOST=state
      - REDIS_PORT=6379
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./realtime-engine:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy

  telemetry-broker: 
    image: emqx/nanomq:0.24.9-full
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"

  message-broker:
    image: rabbitmq:4-management
    ports:
      - "${MESSAGE_BROKER_AMQP_PORT:-5672}:5672"          # AMQP
      - "${MESSAGE_BROKER_MANAGEMENT_PORT:-15672}:15672"  # Management UI
      - "${MESSAGE_BROKER_PROMETHEUS_PORT:-15692}:15692"  # Prometheus
    volumes:
      - message_broker_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  publisher:
    build:
      context: ./publisher
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.dev
    command: 
      [
        "uv", 
        "run", 
        "celery", 
        "-A", 
        "publisher", 
        "worker", 
        "--loglevel=info"
      ]
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-message-broker}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - DB_NAME=${DB_NAME:-databus}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=store
      - DB_PORT=5432
      - REDIS_HOST=state
      - REDIS_PORT=6379
    volumes:
      - ./publisher:/app
      - gtfs_rt_feeds:/app/feed/files
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.dev
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "scheduler",
        "beat",
        "--loglevel=info",
      ]
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-message-broker}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
    volumes:
      - ./scheduler:/app
    depends_on:
      store:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  analytics-engine:
    image: prefecthq/prefect:3-latest
    ports:
      - "${ANALYTICS_PORT:-4200}:4200"
    environment:
      - PREFECT_SERVER_API_HOST=${PREFECT_SERVER_API_HOST:-0.0.0.0}
      - PREFECT_API_URL=${PREFECT_API_URL:-http://localhost:4200/api}
    volumes:
      - ./analytics-engine:/prefect
    working_dir: /prefect
    command: prefect server start

volumes:
  store_data:
  state_data:
  message_broker_data:
  gtfs_rt_feeds:
