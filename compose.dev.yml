name: databus-dev
services:

  orchestrator:
    build:
      context: ./backend
      target: dev
    environment:
      - DJANGO_SETUP=True
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    env_file:
      - .env
      - .env.dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy

  realtime-engine:
    build:
      context: ./backend
      target: realtime-engine
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - MQTT_CONSUMER_ENABLED=true
      - MQTT_HOST=telemetry-broker
      - MQTT_PORT=1883
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      telemetry-broker:
        condition: service_started

  schedule-engine:
    build:
      context: ./backend
      target: schedule-engine
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      target: scheduler
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  database:
    build:
      context: ./database
    environment:
      - POSTGRES_DB=${DB_NAME:-databus}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-databus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  state:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${STATE_PORT:-6379}:6379"
    volumes:
      - state_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  telemetry-broker:
    image: emqx/nanomq:0.24.9-full
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - ./telemetry-broker/nanomq.conf:/etc/nanomq.conf

  message-broker:
    image: rabbitmq:4-management
    ports:
      - "${MESSAGE_BROKER_AMQP_PORT:-5672}:5672"          # AMQP
      - "${MESSAGE_BROKER_MANAGEMENT_PORT:-15672}:15672"  # Management UI
      - "${MESSAGE_BROKER_PROMETHEUS_PORT:-15692}:15692"  # Prometheus
    volumes:
      - ./message-broker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - message_broker_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-engine:
    image: prefecthq/prefect:3-latest
    ports:
      - "${ANALYTICS_PORT:-4200}:4200"
    environment:
      - PREFECT_SERVER_API_HOST=${PREFECT_SERVER_API_HOST:-0.0.0.0}
      - PREFECT_API_URL=${PREFECT_API_URL:-http://localhost:4200/api}
    volumes:
      - ./analytics-engine:/prefect
    working_dir: /prefect
    command: prefect server start

  task-monitoring:
    image: mher/flower:2.0
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@${RABBITMQ_HOST:-message-broker}:${RABBITMQ_PORT:-5672}//
      - TZ=America/Costa_Rica
    ports:
      - "${TASK_MONITORING_PORT:-5555}:5555"
    depends_on:
      message-broker:
        condition: service_healthy

  user-interface:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      - NUXT_PUBLIC_API_BASE=http://orchestrator:8000
      - NUXT_PORT=3000
    env_file:
      - .env
      - .env.dev
    ports:
      - "${USER_INTERFACE_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - ui_node_modules:/app/node_modules
      - ui_pnpm_store:/pnpm-store
      # Nuxt writes these constantly; keep them on native volumes, not the
      # macOS bind mount, to avoid "Unknown system error -35" on write/open.
      - /app/.nuxt
      - /app/.output
      - /app/.nitro
      - /app/.cache
    depends_on:
      orchestrator:
        condition: service_started

volumes:
  database_data:
  state_data:
  lake_data:
  message_broker_data:
  ui_node_modules:
  ui_pnpm_store:
  backend_venv:

networks:
  default:
    name: databus_network
